name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Devnet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install latest
          avm use latest
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install Node dependencies
        working-directory: anchor
        run: yarn install

      - name: Restore deploy keypair from secret
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.DEPLOY_KEYPAIR }}" > ~/.config/solana/id.json

      - name: Set Solana cluster to devnet
        run: solana config set --url devnet

      - name: Check deployer balance
        run: solana balance

      - name: Build program
        working-directory: anchor
        run: anchor build

      - name: Deploy to Devnet
        working-directory: anchor
        run: anchor deploy --provider.cluster devnet

      - name: Notify success
        run: echo "✅ Voting program deployed to devnet successfully!"